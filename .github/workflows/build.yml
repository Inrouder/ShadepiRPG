name: Test and build Shadepi

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release veröffentlichen, z. B. v0.20.6 (muss der Version in project.godot entsprechen; leer = nur testen und bauen)'
        required: false
        default: ''

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Godot and desktop export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "/tmp/godot" >> "$GITHUB_PATH"
          ln -s "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /tmp/godot/godot
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$target"
          unzip -q -j /tmp/templates.tpz 'templates/windows_release_x86_64.exe' 'templates/linux_release.x86_64' -d "$target"
      - name: Audit repository status, links and export boundaries
        run: python3 tools/audit_repository.py
      - name: Validate auxiliary asset generator
        run: node --check tools/generate_assets.cjs
      - name: Import resources
        run: godot --headless --editor --import --quit
      - name: Parse test scripts before running gameplay
        run: godot --headless --check-only --script res://tests/run.gd
      - name: Smoke launch main menu and detect runtime errors
        shell: bash
        run: |
          set -euo pipefail
          timeout 25s godot --headless --quit-after 5 2>&1 | tee /tmp/startup.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|Parse Error' /tmp/startup.log; then exit 1; fi
      - name: Validate capped HQ rendering and display/input lifecycle
        shell: bash
        run: |
          set -euo pipefail
          XDG_DATA_HOME=/tmp/shadepi-hq-ci godot --headless --script res://tests/hq_display.gd 2>&1 | tee /tmp/hq-display.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/hq-display.log; then exit 1; fi
      - name: Validate Raven net silhouette, poses and cleanup
        shell: bash
        run: |
          set -euo pipefail
          XDG_DATA_HOME=/tmp/shadepi-net-ci godot --headless --script res://tests/net_avatar.gd 2>&1 | tee /tmp/net-avatar.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/net-avatar.log; then exit 1; fi
      - name: Validate ICE boss, moving orbs, cover and controller
        shell: bash
        run: |
          set -euo pipefail
          XDG_DATA_HOME=/tmp/shadepi-ice-ci godot --headless --script res://tests/ice_boss.gd 2>&1 | tee /tmp/ice-boss.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/ice-boss.log; then exit 1; fi
      - name: Validate scene atmosphere, clipping and pause
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/scene_atmosphere.gd 2>&1 | tee /tmp/scene-atmosphere.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|Parse Error' /tmp/scene-atmosphere.log; then exit 1; fi
      - name: Validate report 8 fixes and hangar departure
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/report8.gd 2>&1 | tee /tmp/report8.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|Parse Error' /tmp/report8.log; then exit 1; fi
      - name: Validate sanctuary chronology and controller checkpoints
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/sanctuary_story.gd 2>&1 | tee /tmp/sanctuary-story.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|Parse Error' /tmp/sanctuary-story.log; then exit 1; fi
      - name: Validate sanctuary art proportions and pose continuity
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/sanctuary_art.gd 2>&1 | tee /tmp/sanctuary-art.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|Parse Error' /tmp/sanctuary-art.log; then exit 1; fi
      - name: Validate lake arrival, romantic contact poses and scene checkpoints
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/lake_sequence.gd 2>&1 | tee /tmp/lake-sequence.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/lake-sequence.log; then exit 1; fi
      - name: Validate registered Aerodyne mechanical frames and cabin lifecycle
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/aerodyne_art.gd 2>&1 | tee /tmp/aerodyne-art.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/aerodyne-art.log; then exit 1; fi
      - name: Validate vehicle bank poses, contact registration and controller response
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/vehicle_motion.gd 2>&1 | tee /tmp/vehicle-motion.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/vehicle-motion.log; then exit 1; fi
      - name: Validate pursuit recoil, muzzle origins and cargo rotor registration
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/pursuit_art.gd 2>&1 | tee /tmp/pursuit-art.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/pursuit-art.log; then exit 1; fi
      - name: Validate operating technology, access feedback and destroyed checkpoints
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/technology_props.gd 2>&1 | tee /tmp/technology-props.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/technology-props.log; then exit 1; fi
      - name: Validate latest resume, all authored test checkpoints and menu controller exit
        shell: bash
        run: |
          set -euo pipefail
          test_data_root="$(mktemp -d /tmp/shadepi-menu-tests.XXXXXX)"
          XDG_DATA_HOME="$test_data_root" godot --headless --script res://tests/menu_checkpoints.gd 2>&1 | tee /tmp/menu-checkpoints.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/menu-checkpoints.log; then exit 1; fi
          XDG_DATA_HOME="$test_data_root" godot --headless --script res://tests/menu_navigation.gd 2>&1 | tee /tmp/menu-navigation.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/menu-navigation.log; then exit 1; fi
      - name: Validate physical blood hits, grounded decals, pause and cleanup
        shell: bash
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$(mktemp -d /tmp/shadepi-blood-tests.XXXXXX)" godot --headless --script res://tests/blood_fx.gd 2>&1 | tee /tmp/blood-fx.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/blood-fx.log; then exit 1; fi
      - name: Validate moonlit lake frames, pause, cleanup and chapter menu containment
        shell: bash
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$(mktemp -d /tmp/shadepi-moon-tests.XXXXXX)" godot --headless --script res://tests/moon_lake_menu.gd 2>&1 | tee /tmp/moon-menu.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/moon-menu.log; then exit 1; fi
      - name: Validate reported sprite sizes, reactions, routes and chapter transitions
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/bug_report_v045.gd 2>&1 | tee /tmp/bug-report-v045.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/bug-report-v045.log; then exit 1; fi
      - name: Validate Chapter-1 contact poses, visible introduction and checkpoint cancellation
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/chapter_one_intro.gd 2>&1 | tee /tmp/chapter-one-intro.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/chapter-one-intro.log; then exit 1; fi
      - name: Validate ice-bath poses, physical rescue and chapter checkpoints
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/ice_bath.gd 2>&1 | tee /tmp/ice-bath.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/ice-bath.log; then exit 1; fi
      - name: Validate garage descent, hangar reveal and rider ownership
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/hangar_discovery.gd 2>&1 | tee /tmp/hangar-discovery.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/hangar-discovery.log; then exit 1; fi
      - name: Validate cinematic entrances, hangar routes and continuous flight
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/cinematic_blocking.gd 2>&1 | tee /tmp/cinematic-blocking.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/cinematic-blocking.log; then exit 1; fi
      - name: Validate Tower extraction, damage checkpoints and departure
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/tower_sequence.gd 2>&1 | tee /tmp/tower-sequence.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|Parse Error' /tmp/tower-sequence.log; then exit 1; fi
      - name: Validate fullscreen, 16:9 scaling and display controller input
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/display_settings.gd 2>&1 | tee /tmp/display-settings.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/display-settings.log; then exit 1; fi
      - name: Run gameplay and save validation
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --script res://tests/run.gd 2>&1 | tee /tmp/tests.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/tests.log; then exit 1; fi
      - name: Validate flight emergency and chase physics
        run: godot --headless --script res://tests/drive_action.gd
      - name: Validate terminal puzzles and story integration
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/terminal_puzzles.gd 2>&1 | tee /tmp/terminal-puzzles.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/terminal-puzzles.log; then exit 1; fi
      - name: Validate terminal controller input and focus
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/terminal_controller.gd 2>&1 | tee /tmp/terminal-controller.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/terminal-controller.log; then exit 1; fi
      - name: Validate arcade waves, barriers and checkpoints
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/arcade_waves.gd 2>&1 | tee /tmp/arcade-waves.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/arcade-waves.log; then exit 1; fi
      - name: Validate charged attacks, kicks and animation states
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/combat_moves.gd 2>&1 | tee /tmp/combat-moves.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/combat-moves.log; then exit 1; fi
      - name: Validate Aerodyne flight, sequence calibration and landing
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/aerodyne_flight.gd 2>&1 | tee /tmp/aerodyne-flight.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/aerodyne-flight.log; then exit 1; fi
      - name: Validate Raven origins, enemy poses and combat voices
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/raven_enemy_combat.gd 2>&1 | tee /tmp/raven-enemy.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/raven-enemy.log; then exit 1; fi
      - name: Validate monastery memory map and return flow
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/monastery_memory.gd 2>&1 | tee /tmp/monastery-memory.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/monastery-memory.log; then exit 1; fi
      - name: Validate monastery waves, protection scenes and walking cycles
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/monastery_battle.gd 2>&1 | tee /tmp/monastery-battle.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/monastery-battle.log; then exit 1; fi
      - name: Validate second memory, sacrifice and save compatibility
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/sacrifice_memory.gd 2>&1 | tee /tmp/sacrifice-memory.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/sacrifice-memory.log; then exit 1; fi
      - name: Validate final memory, two-boss battle and sanctuary transfer
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/legacy_memory.gd 2>&1 | tee /tmp/legacy-memory.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/legacy-memory.log; then exit 1; fi
      - name: Validate digital NPC visuals
        run: godot --headless --script res://tests/npc_dive_visuals.gd
      - name: Validate story, chapter flow, geometry and dialogue
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --script res://tests/story_audit.gd 2>&1 | tee /tmp/story-audit.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/story-audit.log; then exit 1; fi
          godot --headless --script res://tests/story_plan.gd 2>&1 | tee /tmp/story-plan.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/story-plan.log; then exit 1; fi
          XDG_DATA_HOME="$(mktemp -d /tmp/shadepi-ambient-tests.XXXXXX)" godot --headless --script res://tests/ambient_audio.gd 2>&1 | tee /tmp/ambient-audio.log
          if grep -Eq 'SCRIPT ERROR|^ERROR:|FAIL:' /tmp/ambient-audio.log; then exit 1; fi
      - name: Export Windows and Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux
          godot --headless --export-release 'Windows Desktop' build/windows/Shadepi-Echos-in-Neon.exe
          godot --headless --export-release Linux build/linux/Shadepi-Echos-in-Neon.x86_64
          chmod +x build/linux/Shadepi-Echos-in-Neon.x86_64
          build/linux/Shadepi-Echos-in-Neon.x86_64 --headless --quit-after 90
          cp README.md docs/GODOT-LICENSE.txt docs/GODOT-COPYRIGHT.txt build/windows/
          cp README.md docs/GODOT-LICENSE.txt docs/GODOT-COPYRIGHT.txt build/linux/
      - name: Prepare project source
        shell: bash
        run: |
          mkdir -p build/source
          git archive --format=zip --output=build/source/ShadepiRPG-Godot-Projekt.zip HEAD
      - uses: actions/upload-artifact@v6
        with:
          name: ShadepiRPG-Windows
          path: build/windows/
          retention-days: 30
      - uses: actions/upload-artifact@v6
        with:
          name: ShadepiRPG-Linux
          path: build/linux/
          retention-days: 30
      - uses: actions/upload-artifact@v6
        with:
          name: ShadepiRPG-Godot-Projekt
          path: build/source/
          retention-days: 30
  release:
    needs: game
    # Tag push, or a manual run with a release tag (creates the tag on this commit).
    if: (startsWith(github.ref, 'refs/tags/') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Check tag against game version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG passt nicht zur Spielversion v$version"; exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          name: ShadepiRPG-Windows
          path: windows
      - uses: actions/download-artifact@v7
        with:
          name: ShadepiRPG-Linux
          path: linux
      - uses: actions/download-artifact@v7
        with:
          name: ShadepiRPG-Godot-Projekt
          path: source
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd windows && zip -9 ../ShadepiRPG-Windows.zip * && cd ..
          chmod +x linux/Shadepi-Echos-in-Neon.x86_64
          cd linux && zip -9 ../ShadepiRPG-Linux.zip * && cd ..
          gh release create "$RELEASE_TAG" ShadepiRPG-Windows.zip ShadepiRPG-Linux.zip source/ShadepiRPG-Godot-Projekt.zip \
            --target "$GITHUB_SHA" --title "Shadepi $RELEASE_TAG" --generate-notes
